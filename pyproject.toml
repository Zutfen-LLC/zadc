[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "zutfen-zadc"
version = "0.1.0.dev0"
description = "Open contract and tooling for evidence-backed, human-authorized agentic software development."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE.md"]
authors = [
    { name = "Zutfen LLC" },
]
keywords = [
    "agentic-development",
    "ai-agents",
    "software-governance",
    "provenance",
    "ci-cd",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.0,<3",
]

[project.scripts]
zadc = "zadc.cli:main"

[project.urls]
Homepage = "https://github.com/Zutfen-LLC/zadc"
Repository = "https://github.com/Zutfen-LLC/zadc"
Documentation = "https://github.com/Zutfen-LLC/zadc#readme"
Issues = "https://github.com/Zutfen-LLC/zadc/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/zadc"]

[tool.hatch.build.targets.sdist]
include = [
    "src/zadc",
    "tests",
    "schemas",
    "scripts",
    "README.md",
    "LICENSE.md",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.12.0",
    "mypy>=1.17.0",
    "build>=1.3.0",
    "twine>=6.1.0",
    "zizmor>=1.0,<2",
    "jsonschema>=4.23.0,<5",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["UP045", "UP007"]  # Don't convert Optional[X] to X | None (pydantic compat)

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # allow asserts in tests if needed

[tool.ruff.format]
line-ending = "lf"

[tool.mypy]
strict = true
python_version = "3.11"
mypy_path = "src"
explicit_package_bases = true
packages = ["src.zadc", "tests", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=zadc --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
source = ["src/zadc"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 100
exclude_also = [
    "if __name__ == .__main__.:",
    "raise SystemExit",
    "if TYPE_CHECKING:",
]
