name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "30 1 * * 1"

permissions:
  contents: read
  actions: read
  packages: read
  security-events: write

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        # actions/checkout@v4.2.2
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        # github/codeql-action/init@v3.28.21
        uses: github/codeql-action/init@a2983b8bed1923f44751c5c43237f479442827b3
        with:
          languages: python

      - name: Autobuild
        # github/codeql-action/autobuild@v3.28.21
        uses: github/codeql-action/autobuild@a2983b8bed1923f44751c5c43237f479442827b3

      - name: Perform CodeQL Analysis
        # github/codeql-action/analyze@v3.28.21
        uses: github/codeql-action/analyze@a2983b8bed1923f44751c5c43237f479442827b3
